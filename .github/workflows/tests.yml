name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            database_url: sqlite:///ci.sqlite3
          - database: postgres
            database_url: postgres://pharmaconnect:pharmaconnect@localhost:5432/pharmaconnect

    name: test (${{ matrix.database }})

    # Throwaway PostgreSQL for the postgres job (unused by the sqlite job).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pharmaconnect
          POSTGRES_PASSWORD: pharmaconnect
          POSTGRES_DB: pharmaconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmaconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: ${{ matrix.database_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
