<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaConnect | Live Map</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <!-- Leaflet Routing -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

    <style>
        #map { height: 600px; width: 100%; z-index: 10; }
        .leaflet-pane { z-index: 10 !important; }
        .leaflet-top, .leaflet-bottom { z-index: 20 !important; }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans">

<!-- NAVBAR -->
<nav class="bg-emerald-600 text-white shadow-lg relative z-50">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <a href="{% url 'home' %}" class="text-2xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-heart-pulse"></i> PharmaConnect
        </a>
        <div class="hidden md:flex space-x-8 items-center">
            <a href="#" class="hover:text-emerald-200">Dashboard</a>
            <a href="#" class="font-bold border-b-2 border-white">Live Map</a>
            <div class="flex items-center gap-2 bg-emerald-700 px-4 py-2 rounded-full">
                <i class="fa-solid fa-user-circle"></i>
                <span>{{ request.user.username }}</span>
            </div>
        </div>
    </div>
</nav>

<!-- MAIN -->
<main class="container mx-auto px-6 py-8">

<!-- SEARCH BAR -->
<div class="bg-white p-6 rounded-xl shadow-md mb-6 border border-gray-100">
    <div class="flex flex-col md:flex-row gap-4 items-center justify-between">

        <!-- Medicine Input -->
        <div class="w-full md:w-1/2 relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
            </div>

            <input
                type="text"
                id="medicineInput"
                autocomplete="off"
                onkeyup="fetchSuggestions(this.value)"
                class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                placeholder="Enter medicine name (e.g. Dolo 650)..."
            >

            <!-- Suggestions -->
            <ul id="suggestionsBox"
                class="absolute w-full bg-white border border-gray-200 rounded-lg shadow-lg mt-1 hidden z-50 max-h-48 overflow-y-auto">
            </ul>
        </div>

        <!-- Buttons -->
        <div class="flex gap-3 w-full md:w-auto">
            <button onclick="searchMedicine(false)"
                    class="bg-emerald-600 text-white px-6 py-3 rounded-lg hover:bg-emerald-700">
                <i class="fa-solid fa-search"></i> Search
            </button>

            <button onclick="showAlternatives()"
                    class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
                <i class="fa-solid fa-shuffle"></i> Alternatives
            </button>

            <button onclick="searchMedicine(true)"
                    class="bg-red-500 text-white px-6 py-3 rounded-lg animate-pulse hover:bg-red-600">
                <i class="fa-solid fa-truck-medical"></i> Emergency
            </button>
        </div>
    </div>
</div>

<!-- MAP -->
<div class="bg-white p-2 rounded-xl shadow-lg border border-gray-200">
    <div id="map" class="rounded-lg overflow-hidden"></div>
</div>

</main>

<!-- JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>
/* ================= MAP SETUP ================= */
let map = L.map('map').setView([10.8219745, 76.6432853], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let currentLat = null;
let currentLon = null;
let userMarker = null;
let markers = [];
let routeControl = null;

/* ================= HELPERS ================= */
function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
}

function clearRoute() {
    if (routeControl) {
        map.removeControl(routeControl);
        routeControl = null;
    }
}

/* ================= USER LOCATION ================= */
map.on('click', function(e) {
    currentLat = e.latlng.lat;
    currentLon = e.latlng.lng;

    if (userMarker) map.removeLayer(userMarker);

    userMarker = L.marker([currentLat, currentLon])
        .addTo(map)
        .bindPopup("Your Location")
        .openPopup();

    clearRoute();
});

/* ================= ROUTE ================= */
function drawRoute(destLat, destLon) {
    clearRoute();

    routeControl = L.Routing.control({
        waypoints: [
            L.latLng(currentLat, currentLon),
            L.latLng(destLat, destLon)
        ],
        lineOptions: {
            styles: [{ color: "#10B981", weight: 5 }]
        },
        addWaypoints: false,
        draggableWaypoints: false,
        fitSelectedRoutes: true,
        show: false
    }).addTo(map);
}

function openGoogleMaps(lat, lon) {
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`, "_blank");
}

/* ================= SEARCH ================= */
function searchMedicine(emergency=false) {
    if (!currentLat || !currentLon) {
        alert("Click on map to set your location");
        return;
    }

    const medicine = document.getElementById("medicineInput").value;
    if (!medicine) return alert("Enter medicine");

    let url = `/api/inventory/availability/?medicine=${encodeURIComponent(medicine)}&lat=${currentLat}&lon=${currentLon}`;
    if (emergency) url += "&emergency=true";

    clearMarkers();
    clearRoute();

    fetch(url, { credentials: "include" })
        .then(res => res.json())
        .then(data => {
            data.results.forEach((p, index) => {
                let marker = L.circleMarker([p.latitude, p.longitude], {
                    radius: 10,
                    color: index === 0 ? "red" : "blue",
                    fillOpacity: 0.9
                }).addTo(map);

                marker.bindPopup(`
                    <div style="width:220px">
                        <h3 style="font-weight:700">${p.pharmacy}</h3>
                        <p>📍 ${p.distance_km} km</p>
                        <p>📦 Stock: <b>${p.quantity}</b></p>
                        <p style="color:${p.is_24x7 ? '#059669' : '#9CA3AF'}">
                          ${p.is_24x7 ? '24×7 Available' : 'Not 24×7'}
                        </p>

                        <button style="width:100%;background:#10B981;color:white;
                        padding:6px;border-radius:6px;margin-top:6px"
                        onclick="drawRoute(${p.latitude},${p.longitude})">
                        Show Route</button>

                        <button style="width:100%;background:#2563EB;color:white;
                        padding:6px;border-radius:6px;margin-top:4px"
                        onclick="openGoogleMaps(${p.latitude},${p.longitude})">
                        Open in Google Maps</button>
                    </div>
                `);

                markers.push(marker);
            });
        });
}

/* ================= ALTERNATIVES ================= */
function showAlternatives() {
    if (!currentLat || !currentLon) return alert("Click map first");

    const medicine = document.getElementById("medicineInput").value;
    if (!medicine) return;

    clearMarkers();
    clearRoute();

    fetch(`/api/medicines/smart-substitutes/?brand=${encodeURIComponent(medicine)}&lat=${currentLat}&lon=${currentLon}`,
        { credentials: "include" })
        .then(res => res.json())
        .then(data => {
            data.nearest_substitutes.forEach(p => {
                let marker = L.circleMarker([p.latitude, p.longitude], {
                    radius: 10,
                    color: "green",
                    fillOpacity: 0.9
                }).addTo(map);

                marker.bindPopup(`<b>${p.medicine}</b><br>${p.pharmacy}`);
                markers.push(marker);
            });
        });
}

/* ================= SUGGESTIONS ================= */
function fetchSuggestions(q) {
    const box = document.getElementById("suggestionsBox");
    if (q.length < 2) return box.classList.add("hidden");

    fetch(`/api/medicines/suggest/?q=${encodeURIComponent(q)}`)
        .then(res => res.json())
        .then(data => {
            box.innerHTML = "";
            data.forEach(name => {
                let li = document.createElement("li");
                li.className = "px-4 py-2 hover:bg-emerald-100 cursor-pointer";
                li.innerText = name;
                li.onclick = () => {
                    document.getElementById("medicineInput").value = name;
                    box.classList.add("hidden");
                };
                box.appendChild(li);
            });
            box.classList.remove("hidden");
        });
}
</script>

</body>
</html>
