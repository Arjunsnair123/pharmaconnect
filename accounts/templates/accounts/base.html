{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PharmaConnect{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

<nav class="bg-emerald-600 text-white shadow-lg">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
       <a href="{% url 'home' %}" class="text-2xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-heart-pulse"></i> PharmaConnect
        </a>

        <div class="flex items-center gap-4">
            {% if request.user.is_authenticated %}
                <span class="bg-emerald-700 px-4 py-1 rounded-full">
                    <i class="fa-solid fa-user"></i> {{ request.user.username }}
                </span>
                <a href="{% url 'logout' %}" class="border px-3 py-1 rounded hover:bg-white hover:text-emerald-600">
                    Logout
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="border px-3 py-1 rounded hover:bg-white hover:text-emerald-600">
                    Login
                </a>
                <a href="{% url 'register' %}" class="border px-3 py-1 rounded hover:bg-white hover:text-emerald-600">
                    Register
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="flex-grow">
    {% block content %}{% endblock %}
</div>

<footer class="bg-gray-800 text-white py-4 text-center text-sm">
    © 2026 PharmaConnect
</footer>

</body>
</html>
