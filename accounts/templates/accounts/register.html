{% extends 'accounts/base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-2xl w-96">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">
      Create Account
    </h2>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <input type="text" name="username" placeholder="Username"
        class="w-full p-3 border border-gray-300 rounded-lg text-gray-800 bg-white">

      <input type="email" name="email" placeholder="Email"
        class="w-full p-3 border border-gray-300 rounded-lg text-gray-800 bg-white">

      <input type="password" name="password" placeholder="Password"
        class="w-full p-3 border border-gray-300 rounded-lg text-gray-800 bg-white">

      <select name="role"
        class="w-full p-3 border border-gray-300 rounded-lg text-gray-800 bg-white">
        <option value="PATIENT">Patient</option>
        <option value="PHARMACY">Pharmacy</option>
      </select>

      <button class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
        Register
      </button>
    </form>

    <p class="text-sm text-center mt-4">
      Already have an account?
      <a href="/accounts/login/" class="text-blue-600 hover:underline">Login</a>
    </p>
  </div>
</div>
{% endblock %}
