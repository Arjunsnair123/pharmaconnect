{% extends 'accounts/base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-2xl w-96">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">
      Create Account
    </h2>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      {% if error %}
      <p class="text-sm text-red-600 text-center">{{ error }}</p>
      {% endif %}

      <input type="text" name="username" placeholder="Username" required
        class="w-full p-3 border border-gray-300 rounded-lg text-gray-800 bg-white">

      <input type="email" name="email" placeholder="Email" required
        class="w-full p-3 border border-gray-300 rounded-lg text-gray-800 bg-white">

      <input type="password" name="password" placeholder="Password" required
        class="w-full p-3 border border-gray-300 rounded-lg text-gray-800 bg-white">

      <button class="w-full bg-emerald-600 text-white py-2 rounded-lg hover:bg-emerald-700 transition">
        Register
      </button>
    </form>

    <p class="text-xs text-center text-gray-500 mt-4">
      Pharmacy accounts are set up by an administrator.
    </p>

    <p class="text-sm text-center mt-4">
      Already have an account?
      <a href="/accounts/login/" class="text-emerald-600 hover:underline">Login</a>
    </p>
  </div>
</div>
{% endblock %}
