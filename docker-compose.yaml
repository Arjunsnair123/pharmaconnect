name: pharmaconnect

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    env_file: .env
    environment:
      # Overrides .env so the same file works for host runs (localhost) and Docker.
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn pharmaconnect.wsgi --bind 0.0.0.0:8000"

  db:
    image: postgres:17.11
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharmaconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pharmaconnect}
    ports:
      # Bound to loopback only so the DB isn't exposed on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
