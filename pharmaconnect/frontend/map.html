<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaConnect | Live Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        /* Custom height for the map to fit the dashboard feel */
        #map {
            height: 600px;
            width: 100%;
            z-index: 10;
        }
        /* Fix for Leaflet z-index issues with Tailwind */
        .leaflet-pane { z-index: 10 !important; }
        .leaflet-top, .leaflet-bottom { z-index: 20 !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-emerald-600 text-white shadow-lg relative z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-heart-pulse"></i> PharmaConnect
            </a>
            <div class="hidden md:flex space-x-8 items-center">
                <a href="#" class="hover:text-emerald-200">Dashboard</a>
                <a href="#" class="font-bold border-b-2 border-white">Live Map</a>
                <a href="#" class="hover:text-emerald-200">My Orders</a>
                <div class="flex items-center gap-2 bg-emerald-700 px-4 py-2 rounded-full">
                    <i class="fa-solid fa-user-circle"></i>
                    <span>Arjun S Nair</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-8">
        
        <div class="bg-white p-6 rounded-xl shadow-md mb-6 border border-gray-100">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                
                <div class="w-full md:w-1/2 relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                    </div>
                    <input type="text" id="medicineInput" 
                        class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
                        placeholder="Enter medicine name (e.g. Dolo 650)...">
                </div>

                <div class="flex gap-3 w-full md:w-auto">
                    <button onclick="searchMedicine(false)" 
                        class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-lg font-medium transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-search"></i> Search
                    </button>
                    
                    <button onclick="showAlternatives()" 
                        class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-shuffle"></i> Alternatives
                    </button>
                    
                    <button onclick="searchMedicine(true)" 
                        class="flex-1 md:flex-none bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-lg font-medium transition flex items-center justify-center gap-2 animate-pulse">
                        <i class="fa-solid fa-truck-medical"></i> Emergency
                    </button>
                </div>
            </div>
            
            <div class="mt-4 text-sm text-gray-500 flex items-center gap-2">
                <i class="fa-solid fa-circle-info text-emerald-500"></i>
                <span>Please <strong>click on the map</strong> to set your current location before searching.</span>
            </div>
        </div>

        <div class="bg-white p-2 rounded-xl shadow-lg border border-gray-200">
            <div id="map" class="rounded-lg overflow-hidden"></div>
        </div>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- 1. Map Initialization (Centered on Palakkad as per your snippet) ---
        // Coordinates: 10.8219745, 76.6432853
        let map = L.map('map').setView([10.8219745, 76.6432853], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // --- 2. Global Variables ---
        let currentLat = null;
        let currentLon = null;
        let userMarker = null;
        let markers = [];

        // --- 3. Helper: Clear Markers ---
        function clearMarkers() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
        }

        // --- 4. Logic: User Location Selection ---
        map.on('click', function(e) {
            currentLat = e.latlng.lat;
            currentLon = e.latlng.lng;

            if (userMarker) map.removeLayer(userMarker);

            // Custom Icon for User
            const userIcon = L.divIcon({
                className: 'bg-transparent',
                html: '<div class="w-6 h-6 bg-blue-600 rounded-full border-2 border-white shadow-lg animate-bounce"></div>'
            });

            userMarker = L.marker([currentLat, currentLon]).addTo(map)
                .bindPopup('<b class="text-blue-600">Your Location</b><br>Searching from here.')
                .openPopup();
        });

        // --- 5. Logic: Search Medicine ---
        function searchMedicine(emergency=false) {
            if (!currentLat || !currentLon) {
                alert("Please click on the map to set your location first!");
                return;
            }

            const medicine = document.getElementById("medicineInput").value;
            if (!medicine) {
                alert("Please enter a medicine name.");
                return;
            }

            // Using your local API endpoint
            let url = `http://127.0.0.1:8000/api/inventory/availability/?medicine=${encodeURIComponent(medicine)}&lat=${currentLat}&lon=${currentLon}`;
            if (emergency) url += "&emergency=true";

            clearMarkers();

            // Visual feedback (Loading)
            const btn = document.querySelector('button[onclick="searchMedicine(false)"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Searching...';

            fetch(url)
            .then(res => res.json())
            .then(data => {
                btn.innerHTML = originalText;
                
                if(data.length === 0) {
                    alert("No stock found nearby.");
                    return;
                }

                data.forEach((p, index) => {
                    // Logic: Nearest is Red (Urgent), others Blue
                    let color = index === 0 ? "#ef4444" : "#3b82f6"; // Tailwind Red-500 : Blue-500

                    let marker = L.circleMarker([p.latitude, p.longitude], {
                        radius: 12,
                        color: "white",
                        weight: 2,
                        fillColor: color,
                        fillOpacity: 0.9
                    }).addTo(map);

                    marker.bindPopup(
                        `<div class="text-sm">
                            <h3 class="font-bold text-gray-800 text-lg">${p.pharmacy}</h3>
                            <p class="text-gray-600"><i class="fa-solid fa-route"></i> ${p.distance_km} km away</p>
                            <p class="text-emerald-600 font-bold"><i class="fa-solid fa-box"></i> Stock: ${p.quantity}</p>
                            <p class="text-xs text-gray-400 mt-1">24x7: ${p.is_24x7 ? "Yes" : "No"}</p>
                            <button class="mt-2 w-full bg-emerald-600 text-white text-xs py-1 rounded hover:bg-emerald-700">Book Now</button>
                        </div>`
                    );

                    markers.push(marker);
                });
            })
            .catch(err => {
                console.error(err);
                btn.innerHTML = originalText;
                alert("Error connecting to server. Is Django running?");
            });
        }

        // --- 6. Logic: Smart Substitutes ---
        function showAlternatives() {
            if (!currentLat || !currentLon) {
                alert("Please click on the map to set your location first!");
                return;
            }

            const medicine = document.getElementById("medicineInput").value;
            if (!medicine) {
                alert("Please enter a medicine name.");
                return;
            }

            let url = `http://127.0.0.1:8000/api/medicines/smart-substitutes/?brand=${encodeURIComponent(medicine)}&lat=${currentLat}&lon=${currentLon}`;

            clearMarkers();

            fetch(url)
            .then(res => res.json())
            .then(data => {
                const results = data.nearest_substitutes;
                
                if(!results || results.length === 0) {
                    alert("No substitutes found.");
                    return;
                }

                results.forEach((p, index) => {
                    // Logic: Green for substitutes
                    let color = index === 0 ? "#10b981" : "#f59e0b"; // Tailwind Emerald : Amber

                    let marker = L.circleMarker([p.latitude, p.longitude], {
                        radius: 12,
                        color: "white",
                        weight: 2,
                        fillColor: color,
                        fillOpacity: 0.9
                    }).addTo(map);

                    marker.bindPopup(
                        `<div class="text-sm">
                            <h3 class="font-bold text-gray-800">${p.medicine}</h3>
                            <p class="text-xs text-gray-500">Substitute at: <b>${p.pharmacy}</b></p>
                            <p class="text-gray-600"><i class="fa-solid fa-route"></i> ${p.distance_km} km away</p>
                            <p class="text-emerald-600 font-bold">Stock: ${p.quantity}</p>
                        </div>`
                    );

                    markers.push(marker);
                });
            })
            .catch(err => {
                console.error(err);
                alert("Error fetching substitutes.");
            });
        }
    </script>

</body>
</html>
