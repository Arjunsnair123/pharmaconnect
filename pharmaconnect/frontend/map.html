<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PharmaConnect | Live Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map { height: 600px; width: 100%; }
    </style>
</head>
<body class="bg-gray-100">

<nav class="bg-emerald-600 text-white p-4 flex justify-between">
    <div class="font-bold text-xl">PharmaConnect</div>
    <div>{{ request.user.username }}</div>
</nav>

<div class="container mx-auto p-6">

    <div class="bg-white p-4 rounded shadow mb-4 flex gap-3">
        <input id="medicineInput" class="border p-2 w-full" placeholder="Enter medicine (e.g. Dolo 650)">
        <button onclick="searchMedicine(false)" class="bg-green-600 text-white px-4 py-2">Search</button>
        <button onclick="showAlternatives()" class="bg-blue-600 text-white px-4 py-2">Alternatives</button>
        <button onclick="searchMedicine(true)" class="bg-red-600 text-white px-4 py-2">Emergency</button>
    </div>

    <p class="text-sm text-gray-600 mb-2">Click on the map to set your location</p>
    <div id="map" class="rounded shadow"></div>

</div>

<script>
let map = L.map('map').setView([10.8219, 76.6432], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let currentLat = null;
let currentLon = null;
let userMarker = null;
let markers = [];

function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
}

map.on('click', function(e) {
    currentLat = e.latlng.lat;
    currentLon = e.latlng.lng;

    if (userMarker) map.removeLayer(userMarker);

    userMarker = L.marker([currentLat, currentLon])
        .addTo(map)
        .bindPopup("Your Location")
        .openPopup();
});

function searchMedicine(emergency=false) {
    if (!currentLat || !currentLon) {
        alert("Click on map first");
        return;
    }

    const medicine = document.getElementById("medicineInput").value;
    if (!medicine) {
        alert("Enter medicine name");
        return;
    }

    let url = `/api/inventory/availability/?medicine=${encodeURIComponent(medicine)}&lat=${currentLat}&lon=${currentLon}`;
    if (emergency) url += "&emergency=true";

    clearMarkers();

    fetch(url, { credentials: "include" })
        .then(res => res.json())
        .then(data => {
            const results = data.results || [];

            if (results.length === 0) {
                alert("No pharmacies have this medicine in stock.");
                return;
            }

            results.forEach((p, index) => {
                let color = index === 0 ? "red" : "blue";

                let marker = L.circleMarker([p.latitude, p.longitude], {
                    radius: 10,
                    color: color,
                    fillOpacity: 0.9
                }).addTo(map);

                marker.bindPopup(
                    `<b>${p.pharmacy}</b><br>
                     Stock: ${p.quantity}<br>
                     Distance: ${p.distance_km} km<br>
                     24x7: ${p.is_24x7 ? "Yes" : "No"}`
                );

                markers.push(marker);
            });
        })
        .catch(err => {
            console.error(err);
            alert("Server error while fetching availability.");
        });
}

function showAlternatives() {
    if (!currentLat || !currentLon) {
        alert("Click on map first");
        return;
    }

    const medicine = document.getElementById("medicineInput").value;
    if (!medicine) {
        alert("Enter medicine name");
        return;
    }

    let url = `/api/medicines/smart-substitutes/?brand=${encodeURIComponent(medicine)}&lat=${currentLat}&lon=${currentLon}`;

    clearMarkers();

    fetch(url, { credentials: "include" })
        .then(res => res.json())
        .then(data => {
            const results = data.nearest_substitutes || [];

            if (results.length === 0) {
                alert("No substitutes found.");
                return;
            }

            results.forEach(p => {
                let marker = L.circleMarker([p.latitude, p.longitude], {
                    radius: 10,
                    color: "green",
                    fillOpacity: 0.9
                }).addTo(map);

                marker.bindPopup(
                    `<b>${p.medicine}</b><br>
                     Pharmacy: ${p.pharmacy}<br>
                     Distance: ${p.distance_km} km`
                );

                markers.push(marker);
            });
        });
}
</script>

</body>
</html>
